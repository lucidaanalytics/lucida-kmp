name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  LUCIDA_TESTDATA: ${{ github.workspace }}/testdata
jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew --no-daemon --console=plain :lucida-kmp:jvmTest
      # Runner images ship an Android SDK (ANDROID_HOME), so the androidMain actuals (Keystore cipher, screenshot,
      # autocapture, guides alert) compile here too.
      - run: ./gradlew --no-daemon --console=plain :lucida-kmp:compileDebugKotlinAndroid
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # perl alarm: a hang fails this step after 20 min (its log is kept), instead of the whole job being cancelled
      - run: perl -e 'alarm shift; exec @ARGV' 1200 ./gradlew --no-daemon --console=plain :lucida-kmp:iosSimulatorArm64Test :lucida-kmp:compileKotlinIosArm64
