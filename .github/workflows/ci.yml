name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  LUCIDA_TESTDATA: ${{ github.workspace }}/testdata
jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew --no-daemon --console=plain :lucida-kmp:jvmTest
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew --no-daemon --console=plain :lucida-kmp:iosSimulatorArm64Test :lucida-kmp:compileKotlinIosArm64
