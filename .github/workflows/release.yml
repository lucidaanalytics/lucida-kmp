name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: macos-latest
    env:
      HAS_CENTRAL: ${{ secrets.MAVEN_CENTRAL_PASSWORD != '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      # aar and jar files only; JitPack serves the tag with the jitpack.yml in this repo.
      - name: Assemble
        run: ./gradlew --no-daemon --console=plain assemble --no-configuration-cache
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            **/build/outputs/aar/*-release.aar
            **/build/libs/*.jar
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" $(find . -path '*/build/outputs/aar/*-release.aar' -o -path '*/build/libs/*.jar') --generate-notes --verify-tag
      # Central has no OIDC publishing: this runs only when the Portal token (MAVEN_CENTRAL_PASSWORD) is set
      # (com.vanniktech.maven.publish reads the ORG_GRADLE_PROJECT_* variables).
      - name: Sign and publish to Maven Central
        if: env.HAS_CENTRAL == 'true'
        run: ./gradlew --no-daemon --console=plain publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
